# RomM for local development and home use.
# First run: ./server/romm/setup.sh, then open http://localhost:8080.
name: potato-romm

volumes:
  mysql_data:
  romm_resources:
  romm_redis_data:

services:
  romm:
    image: rommapp/romm:5.3.1
    container_name: potato-romm
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - HASHEOUS_API_ENABLED=true
      - SCAN_WORKERS=4
    volumes:
      - romm_resources:/romm/resources
      - romm_redis_data:/redis-data
      # Library layout: <library>/roms/<platform>/<game files>, e.g. roms/gba/Game.gba
      - ${ROMM_LIBRARY:-./library}:/romm/library
      - ./assets:/romm/assets
      - ./config:/romm/config
    ports:
      - 8080:8080
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    image: mariadb:12.3.3
    container_name: potato-romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${DB_PASSWD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
